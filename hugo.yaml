  # Clean indigo/violet palette with strong contrast in both modes.
  color:
    textColor: "#1f2333"
    secondaryTextColor: "#5b6072"
    textLinkColor: "#4f46e5"
    backgroundColor: "#ffffff"
    secondaryBackgroundColor: "#f3f4ff"
    primaryColor: "#4f46e5"
    secondaryColor: "#f8f9fa"

