  # -----------------------------------------------------------------
  # Hero
  # -----------------------------------------------------------------
  hero:
    enable: true
    intro: "Hi, I'm"
    title: "Showrav Das."
    subtitle: "Data Science & Machine Learning Researcher"
    content: "I work at the intersection of machine learning, Digital Twin technology, and intelligent predictive maintenance — developing data-driven methods for health monitoring, fault diagnosis, and reliable decision support in complex systems."
