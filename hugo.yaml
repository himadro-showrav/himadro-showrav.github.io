        content: "A FastAPI service for counterfeit-medicine verification using encrypted QR payloads, authenticity checks, and scan tracking. Implements ChaCha20-Poly1305 authenticated encryption, PBKDF2 key derivation, a local issuance registry, and a Dockerized API architecture."
        image: "/images/projects/antifraudqr.png"
        badges:
          - "Python"
          - "FastAPI"
          - "Docker"
          - "Cryptography"
        links:
          - icon: fab fa-github
            url: "https://github.com/himadro-showrav/antifraud_medicine_qr"

      - title: "IoT Gas Leakage Monitoring & Automatic Ventilation System"
        content: "An ESP32-based safety system using three MQ2 sensors at different heights to detect gas leaks. The system triggers a local alarm and exhaust fan and sends real-time alerts through Blynk IoT."
        image: "/images/projects/iot_gas.png"
