      secondaryTextColor: "#b8bacb"
      textLinkColor: "#a5b4fc"
      backgroundColor: "#11121a"
      secondaryBackgroundColor: "#1b1c2a"
      primaryColor: "#a5b4fc"
      secondaryColor: "#1b1c2a"

  # -----------------------------------------------------------------
  # Navigation
  # -----------------------------------------------------------------
