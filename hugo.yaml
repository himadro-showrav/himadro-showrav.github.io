    button:
      enable: true
      name: "View Resume"
      url: "/resume_of_showrav_das.pdf"
      download: true
      newPage: false
    socialLinks:
      fontAwesomeIcons:
        - icon: fab fa-github
          url: "https://github.com/himadro-showrav"
        - icon: fab fa-linkedin
          url: "https://www.linkedin.com/in/showrav-das-a67a2522a/"
      customIcons: []

  # -----------------------------------------------------------------
  # About
  # -----------------------------------------------------------------
  about:
    enable: true
    title: "About Me"
    image: "/images/showrav.png"
    content: |-
      I am a Computer Science and Engineering graduate with a strong interest in Data Science, Machine Learning, and applied AI research. My current research direction focuses on Digital Twin-enabled predictive maintenance for smart manufacturing systems, with an emphasis on health monitoring, fault diagnosis, and predictive analytics.

      I am particularly interested in combining data-driven learning with domain knowledge so that intelligent models are not only accurate, but also useful for real-world engineering systems.

      Through the Erasmus+ international exchange program at Silesian University of Technology in Poland, I gained international academic exposure and experience working in a different research and learning environment.
    skills:
      enable: true
      title: "Research & Technical Skills"
      items:
        - "Python"
        - "NumPy / Pandas"
        - "Scikit-learn"
        - "TensorFlow / Keras"
        - "PyTorch"
        - "Machine Learning"
        - "Deep Learning"
        - "Digital Twin"
        - "Predictive Maintenance"
        - "SQL / Databases"
        - "Data Visualization"
        - "Git / GitHub"

  # -----------------------------------------------------------------
  # Experience
  # -----------------------------------------------------------------
  experience:
    enable: true
    items:
      - company: "BLIZ IT"
        companyUrl: ""
        jobs:
          - name: "WordPress Developer & Lead Generation Officer"
            date: "Jul 2024 - Aug 2025"
            info:
              content: "Dhaka, Bangladesh"
            content: |-
              - Developed and maintained responsive WordPress websites for client requirements.
              - Customized themes and plugins while improving website performance and security.
              - Managed lead-generation activities to support client acquisition.
              - Worked directly with clients and cross-functional teams to deliver tailored web solutions.

  # -----------------------------------------------------------------
  # Education
  # -----------------------------------------------------------------
  education:
    enable: true
    items:
      - title: "Bachelor of Science in Computer Science and Engineering"
        school:
          name: "Daffodil International University"
          url: "https://www.daffodilvarsity.edu.bd"
        date: "Jan 2022 - Jan 2026"
        GPA: "3.73 / 4.00"
        content: |-
          Thesis: "Digital Twin–Enabled Physics-Constrained GAN for Li-ion Battery Health Prognostics." Developed a Digital Twin framework for predictive maintenance of complex systems, integrating physics constraints with generative deep learning for battery health prognostics.

          Relevant coursework: Data Structures & Algorithms, Artificial Intelligence, Data Mining and Machine Learning, Database Management Systems, Computer Networks, Software Engineering, Embedded Systems and IoT, Natural Language Processing, Statistics and Probability.

      - title: "Erasmus+ KA107 International Credit Mobility"
        school:
          name: "Silesian University of Technology"
          url: "https://www.polsl.pl/en/"
        date: "Mar 2024 - Jul 2024"
        content: |-
          International academic exchange in Gliwice, Poland (EQF level 6, 15 ECTS credits).

          Coursework: Computer Networks, Fundamentals of Database Systems, Microprocessor and Embedded Systems, Operating Systems, and Software Engineering.

  # -----------------------------------------------------------------
  # Publications
  #
  # NOTE:
  # Hugo Profile's standard sections do not expose a native
  # "publications" component in the same way as Projects/Education.
  # Keeping publications in their own data block makes the content
  # cleanly separated and ready for a small theme/layout override.
  # -----------------------------------------------------------------
  publications:
    enable: true
    title: "Publications"
    subtitle: "Selected research papers and ongoing research"
    items:
      - title: "Digital Twin–Enabled Physics-Constrained GAN for Li-ion Battery Health Prognostics"
        authors: "Showrav Das; under the supervision of Dr. Md Alamgir Kabir"
        venue: "Research work in progress"
        year: "2026"
        status: "In Progress"
        content: "A Digital Twin-based framework for lithium-ion battery health prognostics using a Physically Constrained GAN, combining physics-informed constraints with deep learning on the NASA battery aging dataset."
        tags:
          - "Digital Twin"
          - "GAN"
          - "Battery Health"
          - "Predictive Maintenance"

      - title: "Physics-Informed LSTM for State-of-Health Prediction of Li-ion Batteries"
        authors: "Showrav Das; Zadid Al Lisan; Md. Mehrab Hossain Badhan; Dr. Md Alamgir Kabir"
        venue: "Research manuscript"
        year: "2026"
        status: "Research Work"
        content: "A Physics-Informed LSTM model for battery State-of-Health forecasting using the NASA dataset, integrating monotonicity and smoothness constraints for physically consistent degradation prediction."
        tags:
          - "Physics-Informed ML"
          - "LSTM"
          - "Battery SOH"

      - title: "SpongePath: A Dataset for Sponge Gourd Leaf Disease Classification"
        authors: "Showrav Das and collaborators"
        venue: "MIET 2026; previously accepted at IDDA 2025"
        year: "2026"
        status: "Submitted"
        content: "A dataset and machine learning study for automated sponge gourd leaf disease identification using SVM, CNN, and VGG16 transfer learning, achieving up to 92% classification accuracy."
        tags:
          - "Computer Vision"
          - "Dataset"
          - "Plant Disease"
          - "Deep Learning"

