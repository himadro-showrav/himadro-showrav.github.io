# -------------------------------------------------------------------
# Site metadata / SEO
# -------------------------------------------------------------------
params:
  title: "Showrav Das"
  author: "Showrav Das"
  description: "Showrav Das — Data Science and Machine Learning researcher working on Digital Twin-enabled predictive maintenance, intelligent health monitoring, and data-driven fault diagnosis."
